<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}header{min-height:100vh;display:flex;align-items:center;background:radial-gradient(circle at 80% 40%,#90000055,transparent 35%),linear-gradient(135deg,#050505,#190000,#050505)}.box{width:90%;max-width:1000px;margin:auto}.logo{position:absolute;top:25px;font-weight:900;letter-spacing:4px;color:#d4af37;text-shadow:0 0 5px #d4af37,0 0 12px #d4af37,0 0 25px #f00;animation:neon 1.8s ease-in-out infinite alternate,shine 3s linear infinite}.logo::first-letter{color:#d4af37}@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8)}}@keyframes neon{from{text-shadow:0 0 5px #d4af37,0 0 10px #d4af37,0 0 18px #f00}to{text-shadow:0 0 8px #d4af37,0 0 20px #d4af37,0 0 35px #f00}}.tag{color:#f22;letter-spacing:3px;font-size:12px}h1{font-size:clamp(65px,16vw,150px);line-height:.8;margin:25px 0}h1 span{color:#f11}p{color:#aaa;font-size:17px;line-height:1.7}.btn{display:inline-block;margin:15px 8px 0 0;padding:14px 20px;border-radius:8px;background:#e71919;color:#fff;text-decoration:none;font-weight:bold}.btn.dark{background:#151515;border:1px solid #333}section{padding:70px 5%;border-top:1px solid #222}h2{font-size:35px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#111;border:1px solid #292929;border-radius:14px;overflow:hidden}.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#300,#080808);color:#f22;font-size:40px;font-weight:bold}.info{padding:16px}.socials{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.social{padding:22px;background:#111;border:1px solid #292929;border-radius:10px;text-align:center;color:white;text-decoration:none;font-weight:bold}footer{text-align:center;padding:40px;color:#666}@media(max-width:700px){.cards{grid-template-columns:1fr}.socials{grid-template-columns:1fr 1fr}}
</style>
