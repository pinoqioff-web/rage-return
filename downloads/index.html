<script>
(function () {
  var attempts = 0;
  var maxAttempts = 10;
  var adScriptLoaded = false;
  var adScriptFailed = false;

  var scripts = document.querySelectorAll('script');

  scripts.forEach(function (script) {
    if (script.src && script.src.indexOf('shameful-farm.com') !== -1) {
      script.addEventListener('load', function () {

  var checker = setInterval(function () {
    attempts++;

    var box = document.querySelector('.ad-container');

    if (!box) return;

    var adElement =
      box.querySelector('iframe') ||
      box.querySelector('ins') ||
      box.querySelector('[class*="ad"]') ||
      box.querySelector('[id*="ad"]');

    if (adScriptLoaded || adElement) {
      clearInterval(checker);
      return;
    }

    if (adScriptFailed || attempts >= maxAttempts) {
      clearInterval(checker);

      if (document.querySelector('.ad-block-warning')) return;

      var warning = document.createElement('div');
      warning.className = 'ad-block-warning';

      warning.style.cssText =
        'margin:20px auto;padding:18px;max-width:600px;' +
        'background:#111;border:1px solid #8b6b3f;border-radius:14px;' +
        'color:#cd9b55;text-align:center;font-family:Arial,sans-serif;';

        '🔄 إعادة المحاولة</button>';

      box.parentNode.insertBefore(warning, box.nextSibling);

})();
