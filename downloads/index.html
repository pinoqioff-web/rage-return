<script>
(function(){
  'use strict';

  var box=document.querySelector('.ad-container');
  if(!box)return;

  setTimeout(function(){

    var entries=performance.getEntriesByType('resource')||[];
    var hilltop=[];
    var frames=box.querySelectorAll('iframe').length;
    var ins=box.querySelectorAll('ins').length;
    var html=box.innerHTML.length;

    for(var i=0;i<entries.length;i++){
      var n=entries[i].name||'';
      if(
        n.indexOf('shameful-farm.com')!==-1 ||
        n.indexOf('hilltopads')!==-1
      ){
        hilltop.push(n);
      }
    }

    var d=document.createElement('div');

    d.style.cssText=
      'margin:20px auto;padding:18px;max-width:650px;' +
      'background:#111;color:#ddd;border:1px solid #8b6b3f;' +
      'border-radius:14px;font:15px/1.8 Arial;text-align:center;';

    d.innerHTML=
      '<b style="color:#cd9b55;font-size:19px">🔎 تشخيص الإعلان</b><br><br>' +
      'iframe داخل الإعلان: <b>'+frames+'</b><br>' +
      'ins داخل الإعلان: <b>'+ins+'</b><br>' +
      'حجم محتوى الحاوية: <b>'+html+'</b><br>' +
      'طلبات Hilltop الظاهرة: <b>'+hilltop.length+'</b><br><br>' +
      '<small style="color:#888">هذا الاختبار مؤقت وسيتم حذفه بعد التشخيص.</small>';

    box.parentNode.insertBefore(d,box.nextSibling);

  },8000);

})();
</script>
