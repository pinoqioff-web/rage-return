<script>
(function () {
  'use strict';

  var box = document.querySelector('.ad-container');
  if (!box) return;

  var start = Date.now();
  var timeout = 8000;
  var finished = false;

  function realAdExists() {
    var nodes = box.querySelectorAll('*');

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var tag = el.tagName ? el.tagName.toLowerCase() : '';
      var cls = typeof el.className === 'string' ? el.className.toLowerCase() : '';
      var id = (el.id || '').toLowerCase();

      if (
        tag === 'iframe' ||
        tag === 'ins' ||
        tag === 'object' ||
        tag === 'embed' ||
        cls.indexOf('banner') !== -1 ||
        cls.indexOf('advert') !== -1 ||
        cls.indexOf('ad-container') !== -1 ||
        id.indexOf('banner') !== -1 ||
        id.indexOf('advert') !== -1
      ) {
        var r = el.getBoundingClientRect();

        if (
          r.width > 20 &&
          r.height > 20 &&
          getComputedStyle(el).display !== 'none' &&
          getComputedStyle(el).visibility !== 'hidden'
        ) {
          return true;
        }
      }
    }

    return false;
  }

  function showWarning() {
    if (finished || document.querySelector('.ad-block-warning')) return;

    finished = true;

    var warning = document.createElement('div');
    warning.className = 'ad-block-warning';

    warning.style.cssText =
      'margin:20px auto;padding:20px;max-width:600px;' +
      'background:#111;border:1px solid #8b6b3f;' +
      'border-radius:14px;color:#cd9b55;text-align:center;' +
      'font-family:Arial,sans-serif;' +
      'box-shadow:0 0 18px rgba(205,155,85,.2);';

    warning.innerHTML =
      '<div style="font-size:28px;margin-bottom:8px">⚠️</div>' +
      '<b style="font-size:19px">الإعلان لا يظهر</b>' +
      '<div style="color:#aaa;font-size:15px;line-height:1.8;margin-top:8px">' +
      'يبدو أن DNS أو مانع الإعلانات يمنع ظهور الإعلان.<br>' +
      'عطّل الحجب لهذا الموقع ثم أعد تحميل الصفحة.' +
      '</div>' +
      '<button onclick="location.reload()" style="' +
      'margin-top:15px;padding:11px 24px;border:0;border-radius:8px;' +
      'background:#b00000;color:#fff;font-size:15px;cursor:pointer;">' +
      '🔄 إعادة المحاولة</button>';

    box.parentNode.insertBefore(warning, box.nextSibling);
  }

  var observer = new MutationObserver(function () {
    if (realAdExists()) {
      finished = true;
      observer.disconnect();
    }
  });

  observer.observe(box, {
    childList: true,
    subtree: true,
    attributes: true
  });

  var timer = setInterval(function () {

    if (realAdExists()) {
      clearInterval(timer);
      observer.disconnect();
      finished = true;
      return;
    }

    if (Date.now() - start >= timeout) {
      clearInterval(timer);
      observer.disconnect();

      if (!realAdExists()) {
        showWarning();
      }
    }

  }, 250);

})();
</script>
